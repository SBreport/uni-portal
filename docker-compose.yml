version: "3.8"

services:
  # ── FastAPI 백엔드 ──
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: uni-api
    ports:
      - "8000:8000"
    volumes:
      - portal-data:/app/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - TZ=Asia/Seoul
      # 비밀값은 하드코딩 금지 — .env 또는 Portainer 환경변수로 주입 (미설정 시 앱 기동 실패)
      - AUTH_SALT=${AUTH_SALT:?AUTH_SALT를 .env 또는 배포 환경변수에 설정하세요}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET을 .env 또는 배포 환경변수에 설정하세요}
      - AUTH_SALT_LEGACY=${AUTH_SALT_LEGACY:-}
      - AUTH_BOOTSTRAP_ADMIN_ID=${AUTH_BOOTSTRAP_ADMIN_ID:-admin}
      - AUTH_BOOTSTRAP_ADMIN_PW_HASH=${AUTH_BOOTSTRAP_ADMIN_PW_HASH:?관리자 초기 비밀번호 해시를 설정하세요}
      - AUTH_BOOTSTRAP_ADMIN_ROLE=${AUTH_BOOTSTRAP_ADMIN_ROLE:-admin}
      - EVENT_SHEET_ID=${EVENT_SHEET_ID:-}
      - CAFE_SHEET_ID=${CAFE_SHEET_ID:-}
      - GOOGLE_CREDENTIALS_FILE=/app/data/credentials.json

  # ── Vue.js 프론트엔드 ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: uni-frontend
    ports:
      - "8080:80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - api

volumes:
  portal-data:
    driver: local
